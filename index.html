<!doctype html>
<html lang="zh-CN">
<head>
<script>
/* theme before first paint: ?theme= > saved choice > dark (default) */
(function () {
  var q = new URLSearchParams(location.search).get('theme'), s = null;
  try { s = localStorage.getItem('av-theme'); } catch (e) {}
  document.documentElement.dataset.theme = (q === 'light' || q === 'dark') ? q : (s === 'light' ? 'light' : 'dark');
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动物之眼 · Animal Vision</title>
<meta name="description" content="同一个世界，六双眼睛。拖动中间的线，比较人、狗、猫、蜜蜂、鹰和小鼠眼里的同一张照片，也可以放进你自己的照片。">
<meta property="og:title" content="动物之眼 · Animal Vision">
<meta property="og:description" content="One world, six eyes. Compare how humans, dogs, cats, bees, eagles and mice see the same photo, or try your own.">
<meta property="og:image" content="assets/cover.jpg">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preload" href="assets/fonts/Fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="top enter" style="--d:0">
  <a class="mark" href="./" aria-label="Animal Vision">
    <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs><linearGradient id="av-spec" x1="6" y1="0" x2="34" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7f74a8"/><stop offset=".32" stop-color="#6a8fae"/><stop offset=".56" stop-color="#7fa38c"/><stop offset=".78" stop-color="#bfa676"/><stop offset="1" stop-color="#b07b6c"/></linearGradient></defs>
      <path class="lg-arc" d="M6.5 13.5A15 15 0 0 1 33.5 13.5" stroke="url(#av-spec)" stroke-width="1.4" stroke-linecap="round"/>
      <path class="lg-lid" d="M3 22Q20 7 37 22Q20 37 3 22Z" stroke-width="1.2" stroke-linejoin="round"/>
      <circle class="lg-iris" cx="20" cy="22" r="7.6" stroke-width=".9"/>
      <circle class="lg-ring" cx="20" cy="22" r="4.6" stroke-width=".9"/>
      <ellipse class="lg-pupil" cx="20" cy="22" rx=".85" ry="3.7"/>
    </svg>
    <span class="wm"><span class="mark-en">Animal <em>Vision</em></span><span class="mark-zh">动物之眼</span></span>
  </a>
  <nav class="top-r">
    <button class="theme" id="theme" type="button" aria-label="Theme">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <g class="th-sun"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></g>
        <path class="th-moon" d="M15.6 12.6A6.4 6.4 0 0 1 7.4 4.4a6.4 6.4 0 1 0 8.2 8.2Z"/>
      </svg>
      <span id="themeL"></span>
    </button>
    <button class="lang" id="lang" type="button">EN</button>
    <a class="gh" href="https://github.com/TTNAN/animal-vision" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </nav>
</header>

<main>
  <section class="intro">
    <p class="eyebrow enter" style="--d:1" id="eyebrow"><b>Comparative Vision</b><span>六种视觉系统 · Six visual systems</span></p>
    <h1 id="tagline" class="enter" style="--d:2">同一个世界，六双眼睛。</h1>
    <div class="intro-r enter" style="--d:3">
      <p id="lede" class="lede"></p>
      <dl class="stats" id="stats"></dl>
    </div>
  </section>

  <section class="stage-wrap">
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="studio">
    <div class="stage-col enter" style="--d:4">
    <div class="halo" aria-hidden="true"></div>
    <div class="stage" id="stage">
      <canvas id="view" aria-label="comparison"></canvas>
      <div class="glow" aria-hidden="true"></div>
      <div class="ticks" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="tag tag-l" id="tagL"></div>
      <div class="tag tag-r" id="tagR"></div>
      <div class="divider" id="divider" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-label="split">
        <span class="knob"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg></span>
      </div>
      <div class="readout" id="readout" aria-live="polite"></div>
      <div class="loupe" id="loupe" aria-hidden="true"><span>×3</span></div>
      <div class="gridtags" id="gridtags"></div>
      <button class="swapbtn" id="swapBtn" type="button" aria-expanded="false" aria-controls="picker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="picker" id="picker">
        <p class="pk-h"></p>
        <div class="pk-list"></div>
        <div class="pk-act">
          <label class="pk-btn" id="pkUp" for="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5m0 0L7.5 9.5M12 5l4.5 4.5M5 19h14"/></svg><span></span></label>
          <label class="pk-btn pk-cam" id="pkCam"><input type="file" id="cam" accept="image/*" capture="user" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span></span></label>
        </div>
      </div>
      <div class="drop" id="drop"><span id="dropText"></span></div>
      <div class="loading" id="loading"><span></span></div>
      <p class="nogl" id="nogl" hidden></p>
    </div>

    <div class="bar enter" style="--d:5">
      <div class="eyes" id="eyes" role="tablist"></div>
      <div class="ctrl">
        <div class="seg" id="lights" role="radiogroup"></div>
        <div class="seg" id="views" role="radiogroup"></div>
        <button class="btn ghost" id="save" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span id="saveText"></span>
        </button>
      </div>
    </div>
    <dl class="stats stats-m" id="statsM"></dl>
  <div class="gallery enter" style="--d:6">
    <div class="sec-h"><h3 id="samplesH"></h3><p class="hint" id="hint"></p></div>
    <div class="thumbs" id="thumbs">
      <label class="upload" id="uploadTile">
        <input type="file" id="file" accept="image/*" hidden>
        <span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <b id="uploadT"></b><small id="uploadS"></small>
      </label>
    </div>
  </div>
    </div>
  <aside class="about enter" style="--d:5" id="about">
    <div class="about-top"><span class="idx" id="spIdx"></span><span id="spKind"></span></div>
    <div class="about-head">
      <p class="latin" id="latin"></p>
      <h2 id="spName"></h2>
      <p class="line" id="spLine"></p>
      <p class="caveat" id="spCaveat"></p>
      <div class="opts" id="opts"></div>
    </div>
    <div class="meters" id="meters"></div>
    <dl class="facts" id="facts"></dl>
  </aside>
    </div>
  </section>



  <section class="atlas" id="atlasSec">
    <div class="atlas-h">
      <p class="kicker" id="atlasK"></p>
      <h3 id="atlasH"></h3>
      <p class="atlas-p" id="atlasP"></p>
    </div>
    <div class="atlas-t" id="atlas" role="list"></div>
  </section>

  <section class="science">
    <div class="sci-h">
      <p class="kicker" id="sciK"></p>
      <h3 id="sciH"></h3>
      <p class="sci-p" id="sciP"></p>
    </div>
    <div class="notes" id="notes"></div>
  </section>
</main>

<footer class="foot">
  <p id="credits"></p>
  <p class="fine">MIT · <a href="https://github.com/TTNAN/animal-vision" target="_blank" rel="noopener">TTNAN/animal-vision</a></p>
</footer>

<script type="module" src="src/app.js"></script>
</body>
</html>
